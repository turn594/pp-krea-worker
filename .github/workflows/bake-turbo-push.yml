name: bake-turbo-push
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: full image ref
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  bake:
    runs-on: [self-hosted, pp-bake]
    timeout-minutes: 180
    steps:
      - name: Build and push baked image
        env:
          IMAGE: ${{ inputs.image_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          export HOME=/tmp
          export PATH=/tmp:$PATH
          export DOCKER_CONFIG=/tmp/docker-cfg-gha
          mkdir -p "$DOCKER_CONFIG"
          AUTH=$(printf 'turn594:%s' "$GITHUB_TOKEN" | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" > "$DOCKER_CONFIG/config.json"
          if [ ! -x /tmp/crane ]; then
            curl -fsSL -o /tmp/crane.tgz https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz
            tar -xzf /tmp/crane.tgz -C /tmp crane
            chmod +x /tmp/crane
          fi
          if [ ! -x /tmp/kaniko-fs/kaniko/executor ]; then
            mkdir -p /tmp/kaniko-fs
            /tmp/crane export gcr.io/kaniko-project/executor:v1.23.2 - | tar -x -C /tmp/kaniko-fs
          fi
          KANIKO=/tmp/kaniko-fs/kaniko/executor
          test -f /workspace/pp-bake/Dockerfile
          du -sh /workspace/pp-bake
          rm -rf /workspace/pp-bake/models/unet /workspace/pp-bake/models/clip
          mkdir -p /kaniko /workspace/pp-bake/.kaniko-tmp
          export TMPDIR=/workspace/pp-bake/.kaniko-tmp
          $KANIKO \
            --dockerfile=/workspace/pp-bake/Dockerfile \
            --context=dir:///workspace/pp-bake \
            --destination="$IMAGE" \
            --cache=false \
            --verbosity=info \
            --snapshot-mode=redo \
            --use-new-run \
            --compressed-caching=false
          rm -f "$DOCKER_CONFIG/config.json"
          echo BUILD_PUSH_OK
