name: make-ghcr-public
on:
  workflow_dispatch:
permissions:
  packages: write
  contents: read
jobs:
  pub:
    runs-on: [self-hosted, pp-bake]
    steps:
      - name: Set package visibility public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          # package name for ghcr.io/turn594/pp-krea-worker
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/packages/container/pp-krea-worker/visibility \
            -d '{"visibility":"public"}' || true
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/users/turn594/packages/container/pp-krea-worker/visibility \
            -d '{"visibility":"public"}' || true
          # also try package versions listing
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/pp-krea-worker | head -c 500 || true
          echo PUBLIC_DONE
