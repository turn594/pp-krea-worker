# Superset of official worker-comfyui src/extra_model_paths.yaml
# + diffusion_models + text_encoders (required for product Krea path).
# Mount: serverless network volume at /runpod-volume
# Docs: https://github.com/runpod-workers/worker-comfyui/blob/main/docs/network-volumes.md

runpod_worker_comfy:
  base_path: /runpod-volume
  checkpoints: models/checkpoints/
  clip: models/clip/
  text_encoders: models/text_encoders/
  clip_vision: models/clip_vision/
  configs: models/configs/
  controlnet: models/controlnet/
  embeddings: models/embeddings/
  loras: models/loras/
  upscale_models: models/upscale_models/
  vae: models/vae/
  unet: models/unet/
  diffusion_models: models/diffusion_models/
